[project]
name = "media-lists"
version = "0.1.0"
description = "Build a media pitch list from a newsroom URL using only addresses published on publisher pages."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12,<1",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "openai>=1.40,<3",
    "rich>=13.7,<15",
    "psycopg[binary]>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
pitchlist = "media_lists.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["media_lists*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
