<svg xmlns="http://www.w3.org/2000/svg" width="360" height="280" viewBox="0 0 360 280" fill="none">
  <defs>
    <linearGradient id="ncMark" x1="40" y1="36" x2="92" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7CCF00"/>
      <stop offset="1" stop-color="#155DFC"/>
    </linearGradient>
    <linearGradient id="ncCard" x1="48" y1="40" x2="320" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="ncShadow" x="0" y="0" width="360" height="280" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Device / card -->
  <rect x="36" y="28" width="288" height="224" rx="18" fill="url(#ncCard)" filter="url(#ncShadow)"/>
  <rect x="36" y="28" width="288" height="224" rx="18" stroke="#E2E8F0"/>

  <!-- Top bar -->
  <rect x="36" y="28" width="288" height="44" rx="18" fill="#0F172A"/>
  <rect x="36" y="50" width="288" height="22" fill="#0F172A"/>

  <!-- Mark -->
  <circle cx="68" cy="50" r="11" fill="url(#ncMark)" opacity="0.25"/>
  <circle cx="68" cy="50" r="5.5" fill="url(#ncMark)"/>
  <path d="M78 44c5.2 1.6 9.2 5.4 11.2 10.2" stroke="url(#ncMark)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M80.5 40.5c7.2 2 12.8 7.5 15.2 14.3" stroke="url(#ncMark)" stroke-width="2.2" stroke-linecap="round"/>

  <text x="92" y="55" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">NewsCrafters</text>

  <!-- Story rows -->
  <rect x="56" y="90" width="72" height="48" rx="8" fill="#E2E8F0"/>
  <rect x="140" y="94" width="150" height="10" rx="5" fill="#0F172A"/>
  <rect x="140" y="112" width="120" height="8" rx="4" fill="#94A3B8"/>
  <rect x="140" y="126" width="96" height="8" rx="4" fill="#CBD5E1"/>

  <rect x="56" y="152" width="72" height="48" rx="8" fill="#E2E8F0"/>
  <rect x="140" y="156" width="150" height="10" rx="5" fill="#0F172A"/>
  <rect x="140" y="174" width="120" height="8" rx="4" fill="#94A3B8"/>
  <rect x="140" y="188" width="96" height="8" rx="4" fill="#CBD5E1"/>

  <!-- CTA chip -->
  <rect x="56" y="216" width="108" height="22" rx="11" fill="#155DFC"/>
  <text x="110" y="231" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">Follow &amp; Curate</text>
</svg>
